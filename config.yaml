model:
  default: gpt-5.6-luna
  provider: openai-codex
toolsets: &id001
- melancholy_read
- kanban
- clarify
- melancholy_contracts
- terminal
platform_toolsets:
  cli: *id001
  telegram: *id001
agent:
  disabled_toolsets:
  - delegation
  - cronjob
  - code_execution
  - browser
  - setup
  - desktop_ui
  - project
  - process_manage
  - file
terminal:
  backend: local
  cwd: /home/mats/Git/Personal/stangyode
kanban:
  dispatch_profiles:
  - stangyode-worker
  auto_decompose: false
  dispatch_in_gateway: false
  review_dispatch: false
  max_in_progress: 1
melancholy:
  role: project_pm
  project_id: stangyode
  envelope: melancholy://projects/stangyode
plugins:
  entries:
    melancholy-governance:
      enabled: true
      allow_tool_override: true
  enabled:
  - melancholy-governance
  disabled: []
hooks:
  pre_tool_call:
  - command: /home/mats/Git/Personal/melancholy/control/policy/pre-tool-call
    timeout: 12
    fail_closed: true
tools:
  tool_search:
    enabled: 'off'
