model:
  default: gpt-5.6-luna
  provider: openai-codex
toolsets: &id001
- melancholy_read
- kanban
- clarify
- melancholy_contracts
- file
- terminal
platform_toolsets:
  cli: *id001
  telegram: *id001
agent:
  disabled_toolsets:
  - delegation
  - cronjob
  - code_execution
  - browser
  - setup
  - desktop_ui
  - project
terminal:
  backend: docker
  cwd: /home/mats/Git/Personal/stangyode
  docker_image: nikolaik/python-nodejs@sha256:a16e28ba6ac93d8ebaa0ce690f4702ae17313ebb15b5f62917c36da84c022893
  docker_mount_cwd_to_workspace: true
  docker_volumes:
  - /home/mats/Git/Personal/stangyode:/home/mats/Git/Personal/stangyode
  docker_forward_env: []
  credential_files: []
  docker_env:
    HOME: /tmp
  docker_run_as_host_user: true
  container_persistent: false
  docker_extra_args: []
kanban:
  dispatch_profiles: []
  auto_decompose: false
  dispatch_in_gateway: false
  review_dispatch: false
  max_in_progress: 1
melancholy:
  role: worker
  project_id: stangyode
  envelope: melancholy://projects/stangyode
plugins:
  entries:
    melancholy-governance:
      enabled: true
      allow_tool_override: true
  enabled:
  - melancholy-governance
  disabled: []
hooks:
  pre_tool_call:
  - command: /home/mats/Git/Personal/melancholy/control/policy/pre-tool-call
    timeout: 12
    fail_closed: true
tools:
  tool_search:
    enabled: 'off'
